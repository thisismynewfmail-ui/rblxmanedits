{% include "partials/head.html" %}
<div class="panel">
  <div class="panel-head">
    <span>{{ message.subject }}</span>
    <span class="head-links"><a href="/messages">&larr; Inbox</a></span>
  </div>
  <div class="panel-body">
    <div class="spread" style="border-bottom:1px dotted var(--line-dot);padding-bottom:8px;margin-bottom:10px">
      <a class="usercard small" href="/profile/{{ other }}" style="display:flex;align-items:center;gap:8px;width:auto;text-align:left;border:0;background:none;padding:0">
        <canvas class="thumb avatar-thumb" width="120" height="120" data-user="{{ other }}"
                style="width:38px;max-width:38px;margin:0"></canvas>
        <span><b>{{ other }}</b><br><span class="tiny muted">conversation</span></span>
      </a>
      <div class="muted tiny right">{{ fmt_time(message.created_at) }}</div>
    </div>

    <div class="thread">
      {% for m in thread %}
      <div class="bubble {{ 'me' if m.sender_id == user.id else 'them' }}">{{ m.body }}<span class="stamp">{{ m.sender_name }} &bull; {{ ago(m.created_at) }}</span></div>
      {% endfor %}
    </div>
  </div>
  <div class="panel-foot spread">
    <span>
      <a class="btn small primary" href="/messages/compose?to={{ other }}&subject=RE: {{ message.subject }}">Reply</a>
      <a class="btn small" href="/messages">Back to inbox</a>
    </span>
    <form method="post" action="/messages/{{ message.id }}/delete" style="display:inline"
          data-confirm="Delete this message?">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn small danger">Delete</button>
    </form>
  </div>
</div>
{% include "partials/foot.html" %}
